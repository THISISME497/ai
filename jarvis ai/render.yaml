services:
  - type: web
    name: jarvis-voice-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: MONGODBURI
        sync: false
      - key: MONGODBURI
        value: jarvis
      - key: OPENAI_API_KEY
        sync: false
